plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suangua.xiaoliuren'
    compileSdk 34

    defaultConfig {
        applicationId "com.suangua.xiaoliuren"
        minSdk 21
        targetSdk 34
        versionCode 118
        versionName "1.2.3"
    }

    signingConfigs {
        release {
            storeFile file('app.keystore')
            storePassword 'xiaoliuren123'
            keyAlias 'xiaoliuren'
            keyPassword 'xiaoliuren123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // FileProvider（应用内更新安装用）
    implementation 'androidx.core:core:1.13.1'
}
