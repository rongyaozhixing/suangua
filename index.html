<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>小六壬占</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="mark">
      <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="#111111"/>
        <path d="M20 3 a17 17 0 0 1 0 34 a8.5 8.5 0 0 1 0 -17 a8.5 8.5 0 0 0 0 -17z" fill="#faf7f0"/>
        <circle cx="20" cy="11.5" r="2.8" fill="#111111"/>
        <circle cx="20" cy="28.5" r="2.8" fill="#faf7f0"/>
      </svg>
    </div>
    <h1>小六壬占</h1>
    <p class="subtitle">六宫掌诀 · 随手一课</p>
    <p class="gua-line">乾 兑 离 震 · 巽 坎 艮 坤</p>
  </header>

  <main class="app-main">

    <!-- 首页：先定所问，再选起卦方式 -->
    <section id="view-home" class="view active">
      <div class="field ask-field">
        <label for="ask-select">所问何事（先定所问，再起卦）</label>
        <select id="ask-select"></select>
      </div>
      <div class="field">
        <label>掌诀版本</label>
        <div class="seg">
          <button class="seg-btn active" data-ver="liugong">六宫</button>
          <button class="seg-btn" data-ver="jiugong">九宫</button>
        </div>
      </div>
      <p class="view-tip">请选择起卦方式</p>
      <div class="method-cards">
        <button class="method-card" data-view="time">
          <span class="mc-icon">☀</span>
          <span class="mc-name">时间起卦</span>
          <span class="mc-desc">取当下年月日时 · 古法正统</span>
        </button>
        <button class="method-card" data-view="num">
          <span class="mc-icon">🔢</span>
          <span class="mc-name">报数字起卦</span>
          <span class="mc-desc">随口报 1-3 个数定三宫</span>
        </button>
        <button class="method-card" data-view="stroke">
          <span class="mc-icon">✍</span>
          <span class="mc-name">写字起卦</span>
          <span class="mc-desc">以汉字笔画数起卦</span>
        </button>
        <button class="method-card" data-view="inspire">
          <span class="mc-icon">✨</span>
          <span class="mc-name">灵机起卦</span>
          <span class="mc-desc">见物闻声 · 即时取数</span>
        </button>
        <button class="method-card" data-view="paipan">
          <span class="mc-icon">☯</span>
          <span class="mc-name">命盘排盘</span>
          <span class="mc-desc">本命盘 · 大运流年</span>
        </button>
      </div>
      <button class="btn-history" data-view="history">📜 历史记录</button>
      <p class="hint center">小六壬仅为民俗参考，不可左右现实抉择。</p>
    </section>

    <!-- 时间起卦页 -->
    <section id="view-time" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>时间起卦</h2>
      </div>
      <div class="field">
        <label>公历日期（自动转农历）</label>
        <div class="date-row">
          <select id="year-select"></select>
          <select id="month-select"></select>
          <select id="day-select"></select>
        </div>
        <p class="lunar-preview" id="lunar-preview"></p>
      </div>
      <div class="field">
        <label for="hour-select">时辰</label>
        <select id="hour-select"></select>
      </div>
      <button class="btn-primary" id="time-submit">起 卦</button>
      <div id="result-time" class="result"></div>
    </section>

    <!-- 报数字起卦页 -->
    <section id="view-num" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>报数字起卦</h2>
      </div>
      <div class="field">
        <label for="num-input">随口报 1-3 个数字（空格隔开）</label>
        <input type="text" id="num-input" inputmode="numeric" placeholder="如：3 18 7">
      </div>
      <button class="btn-primary" id="num-submit">起 卦</button>
      <p class="hint">第一数从大安数，第二数以第一数落宫为一接着数，第三数以第二数落宫为一接着数。</p>
      <div id="result-num" class="result"></div>
    </section>

    <!-- 写字起卦页 -->
    <section id="view-stroke" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>写字起卦</h2>
      </div>
      <div class="field">
        <label for="stroke-input">写 1-3 个字，以笔画数起卦</label>
        <input type="text" id="stroke-input" placeholder="如：出 行">
      </div>
      <button class="btn-primary" id="stroke-submit">起 卦</button>
      <p class="hint">各字笔画依次对应初、中、末三宫。未收录的字请改用「报数字」方式。</p>
      <div id="result-stroke" class="result"></div>
    </section>

    <!-- 灵机起卦页 -->
    <section id="view-inspire" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>灵机起卦</h2>
      </div>
      <div class="field">
        <label for="inspire-input">所见所闻（选填，如：窗外有鸟叫）</label>
        <input type="text" id="inspire-input" placeholder="可留空，直接起卦">
      </div>
      <button class="btn-primary" id="inspire-submit">灵机一动 · 起 卦</button>
      <p class="hint">按当下瞬间取数定宫（见物闻声、心念一动即可占），随机但契合当下。</p>
      <div id="result-inspire" class="result"></div>
    </section>

    <!-- 命盘排盘页 -->
    <section id="view-paipan" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>命盘排盘</h2>
      </div>
      <div class="field">
        <label>出生公历日期</label>
        <div class="date-row">
          <select id="p-year"></select>
          <select id="p-month"></select>
          <select id="p-day"></select>
        </div>
        <p class="lunar-preview" id="p-lunar"></p>
      </div>
      <div class="field">
        <label for="p-hour">出生时辰</label>
        <select id="p-hour"></select>
      </div>
      <div class="field">
        <label>性别（六亲取象参考）</label>
        <div class="seg">
          <button class="seg-btn active" id="p-male">男</button>
          <button class="seg-btn" id="p-female">女</button>
        </div>
      </div>
      <div class="field">
        <label for="p-age">看流年年龄</label>
        <input type="number" id="p-age" inputmode="numeric" min="0" max="120" value="25">
      </div>
      <button class="btn-primary" id="paipan-submit">排 盘</button>
      <div id="result-paipan" class="result"></div>
    </section>

    <!-- 历史记录页 -->
    <section id="view-history" class="view">
      <div class="view-head">
        <button class="btn-back" data-back="home">‹ 返回</button>
        <h2>历史记录</h2>
      </div>
      <div id="history-list" class="history-list"></div>
      <button class="btn-clear-history" id="clear-history">清空历史</button>
    </section>

  </main>

  <footer class="app-footer">民俗文化参考 · 不引导迷信 · v1.0.1</footer>

  <div id="update-bar" class="update-bar">发现新版本，点击刷新 ✨</div>

  <script src="js/lunar.js"></script>
  <script src="js/xiaoliuren.js"></script>
  <script src="js/paipan.js"></script>
  <script src="js/palm.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker：离线缓存 + 新版本提示
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              var bar = document.getElementById('update-bar');
              bar.classList.add('show');
            }
          });
        });
      }).catch(function () {});
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        window.location.reload();
      });
    }
    document.getElementById('update-bar').addEventListener('click', function () {
      var reg = navigator.serviceWorker && navigator.serviceWorker.getRegistration && navigator.serviceWorker.getRegistration();
      if (reg) reg.update();
      window.location.reload();
    });
  </script>
</body>
</html>
